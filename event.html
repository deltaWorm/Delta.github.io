<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мероприятие | Молодежный центр</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <div class="logo">Молодежный центр</div>
        <div class="nav-links">
            <a href="index.html">Главная</a>
            <a href="login.html" id="loginLink">Вход</a>
            <a href="register.html" id="registerLink">Регистрация</a>
            <a href="profile.html" id="profileLink" style="display: none;">Профиль</a>
            <a href="admin.html" id="adminLink" style="display: none;">Админ панель</a>
            <button id="logoutBtn" style="display: none;">Выход</button>
        </div>
    </nav>

    <div class="container">
        <div id="event-detail"></div>

        <h2>Отзывы участников</h2>
        <div id="reviews-list"></div>

        <div id="review-form-container" style="display: none;">
            <h3>Оставить отзыв</h3>
            <form id="reviewForm" enctype="multipart/form-data">
                <div class="form-group">
                    <label>Ваш отзыв</label>
                    <textarea name="text" required></textarea>
                </div>
                <div class="form-group">
                    <label>Фото (необязательно)</label>
                    <input type="file" name="photo" accept="image/*">
                </div>
                <button type="submit" class="btn">Отправить отзыв</button>
            </form>
        </div>

        <div id="application-form-container">
            <h3>Записаться на мероприятие</h3>
            <form id="applicationForm">
                <div id="applicationFields"></div>
                <button type="submit" class="btn">Записаться</button>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        // Получаем ID мероприятия из URL
        const urlParams = new URLSearchParams(window.location.search);
        const eventId = urlParams.get('id');

        async function loadEvent() {
            if (!eventId) return;
            const res = await fetch(`/api/events/${eventId}`);
            const data = await res.json();
            const event = data.event;
            const reviews = data.reviews;

            // Отображаем мероприятие
            document.getElementById('event-detail').innerHTML = `
                <div class="event-card" style="margin-bottom: 2rem;">
                    ${event.image_url ? `<img class="event-image" src="${event.image_url}" style="height:300px;">` : ''}
                    <div class="event-info">
                        <h1>${event.title}</h1>
                        <div>📅 ${event.date}</div>
                        <div>🕒 ${event.time}</div>
                        <div>📍 ${event.location}</div>
                        <p>${event.description}</p>
                    </div>
                </div>
            `;

            // Отображаем отзывы
            const reviewsDiv = document.getElementById('reviews-list');
            if (reviews.length === 0) {
                reviewsDiv.innerHTML = '<p>Пока нет отзывов. Будьте первым!</p>';
            } else {
                reviewsDiv.innerHTML = reviews.map(review => `
                    <div class="event-card" style="margin-bottom:1rem;">
                        <div class="event-info">
                            <div><strong>${review.user_name || 'Гость'}</strong> - ${new Date(review.created_at).toLocaleDateString()}</div>
                            <p>${review.text}</p>
                            ${review.photo_url ? `<img src="${review.photo_url}" style="max-width:100%; max-height:200px; margin-top:10px;">` : ''}
                            ${getUser() && (getUser().role === 'admin' || getUser().id === review.user_id) ? `<button class="btn btn-outline" onclick="deleteReview(${review.id})">Удалить</button>` : ''}
                        </div>
                    </div>
                `).join('');
            }

            // Показываем форму отзыва только для авторизованных участников (не админ? можно и админу, но обычно участник)
            const user = getUser();
            if (user && user.role === 'participant') {
                document.getElementById('review-form-container').style.display = 'block';
            } else {
                document.getElementById('review-form-container').style.display = 'none';
            }

            // Форма заявки
            const appFields = document.getElementById('applicationFields');
            if (user) {
                appFields.innerHTML = `<p>Вы авторизованы как ${user.name}. Нажмите кнопку, чтобы записаться.</p>`;
            } else {
                appFields.innerHTML = `
                    <div class="form-group">
                        <label>Ваше имя</label>
                        <input type="text" name="name" required>
                    </div>
                    <div class="form-group">
                        <label>Ваш email</label>
                        <input type="email" name="email" required>
                    </div>
                `;
            }
        }

        window.deleteReview = async (reviewId) => {
            if (!confirm('Удалить отзыв?')) return;
            const token = getToken();
            const res = await fetch(`/api/reviews/${reviewId}`, {
                method: 'DELETE',
                headers: { 'Authorization': `Bearer ${token}` }
            });
            if (res.ok) {
                loadEvent();
            } else {
                alert('Ошибка удаления');
            }
        };

        // Отправка отзыва
        document.getElementById('reviewForm')?.addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            const token = getToken();
            const res = await fetch(`/api/events/${eventId}/reviews`, {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${token}` },
                body: formData
            });
            if (res.ok) {
                alert('Отзыв добавлен');
                e.target.reset();
                loadEvent();
            } else {
                const err = await res.json();
                alert(err.error || 'Ошибка');
            }
        });

        // Отправка заявки
        document.getElementById('applicationForm')?.addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            const data = {};
            formData.forEach((val, key) => data[key] = val);
            const token = getToken();
            const headers = token ? { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' } : { 'Content-Type': 'application/json' };
            const res = await fetch(`/api/events/${eventId}/applications`, {
                method: 'POST',
                headers,
                body: JSON.stringify(data)
            });
            if (res.ok) {
                alert('Заявка отправлена!');
                e.target.reset();
            } else {
                const err = await res.json();
                alert(err.error || 'Ошибка');
            }
        });

        loadEvent();
        updateNav();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ панель | Молодежный центр</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <div class="logo">Молодежный центр</div>
        <div class="nav-links">
            <a href="index.html">Главная</a>
            <a href="profile.html">Профиль</a>
            <a href="admin.html" class="active">Админ панель</a>
            <button id="logoutBtn">Выход</button>
        </div>
    </nav>

    <div class="container">
        <h1>Управление мероприятиями</h1>
        <button id="createEventBtn" class="btn">Создать мероприятие</button>
        <div id="eventsList"></div>

        <h2>Модерация отзывов</h2>
        <div id="reviewsList"></div>

        <h2>Заявки на мероприятия</h2>
        <div id="applicationsList"></div>
    </div>

    <!-- Модальное окно для создания/редактирования мероприятия -->
    <div id="eventModal" class="modal" style="display: none;">
        <div class="modal-content modal-wide">
            <h3 id="modalTitle">Создать мероприятие</h3>
            <div class="modal-two-columns">
                <!-- Левая колонка: форма -->
                <div class="modal-form">
                    <form id="eventForm" enctype="multipart/form-data">
                        <div class="form-group">
                            <label>Название</label>
                            <input type="text" name="title" id="eventTitle" required>
                        </div>
                        <div class="form-group">
                            <label>Описание</label>
                            <textarea name="description" id="eventDescription" rows="4" required></textarea>
                        </div>
                        <div class="form-group">
                            <label>Дата (ГГГГ-ММ-ДД)</label>
                            <input type="date" name="date" id="eventDate" required>
                        </div>
                        <div class="form-group">
                            <label>Время (ЧЧ:ММ)</label>
                            <input type="time" name="time" id="eventTime" required>
                        </div>
                        <div class="form-group">
                            <label>Место</label>
                            <input type="text" name="location" id="eventLocation" required>
                        </div>
                        <div class="form-group">
                            <label>Изображение (необязательно)</label>
                            <input type="file" name="image" id="eventImage" accept="image/*">
                        </div>
                        <div class="modal-buttons">
                            <button type="button" class="btn-outline" onclick="closeModal()">Отмена</button>
                            <button type="submit" class="btn">Сохранить</button>
                        </div>
                    </form>
                </div>
                <!-- Правая колонка: предпросмотр -->
                <div class="modal-preview">
                    <h4>Предпросмотр мероприятия</h4>
                    <div id="livePreview" class="event-card preview-card">
                        <div class="event-image" id="previewImage" style="background:#d9eef5;"></div>
                        <div class="event-info">
                            <div class="event-title" id="previewTitle">Название мероприятия</div>
                            <div class="event-date" id="previewDate">📅 Дата</div>
                            <div class="event-time" id="previewTime">🕒 Время</div>
                            <div class="event-location" id="previewLocation">📍 Место</div>
                            <div class="event-description" id="previewDescription">Описание</div>
                            <button class="btn" disabled style="margin-top:0.5rem;">Подробнее</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        let editingEventId = null;
        let currentImageFile = null;

        function closeModal() {
            document.getElementById('eventModal').style.display = 'none';
            editingEventId = null;
            document.getElementById('eventForm').reset();
            currentImageFile = null;
            // Сброс предпросмотра
            updatePreview();
        }

        // Обновление предпросмотра в реальном времени
        function updatePreview() {
            const title = document.getElementById('eventTitle').value || 'Название мероприятия';
            const description = document.getElementById('eventDescription').value || 'Описание';
            const date = document.getElementById('eventDate').value || 'ГГГГ-ММ-ДД';
            const time = document.getElementById('eventTime').value || 'ЧЧ:ММ';
            const location = document.getElementById('eventLocation').value || 'Место';
            
            document.getElementById('previewTitle').innerText = title;
            document.getElementById('previewDescription').innerText = description;
            document.getElementById('previewDate').innerHTML = `📅 ${date}`;
            document.getElementById('previewTime').innerHTML = `🕒 ${time}`;
            document.getElementById('previewLocation').innerHTML = `📍 ${location}`;
            
            // Если выбрано новое изображение, показываем его
            if (currentImageFile) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = document.getElementById('previewImage');
                    img.style.backgroundImage = `url(${e.target.result})`;
                    img.style.backgroundSize = 'cover';
                    img.style.backgroundPosition = 'center';
                    img.innerHTML = ''; // убираем пустой div
                };
                reader.readAsDataURL(currentImageFile);
            } else {
                // Если изображения нет, показываем плейсхолдер
                const imgDiv = document.getElementById('previewImage');
                imgDiv.style.backgroundImage = '';
                imgDiv.style.backgroundColor = '#d9eef5';
                imgDiv.innerHTML = '';
            }
        }

        // Отслеживаем изменения в полях формы для обновления предпросмотра
        document.getElementById('eventTitle').addEventListener('input', updatePreview);
        document.getElementById('eventDescription').addEventListener('input', updatePreview);
        document.getElementById('eventDate').addEventListener('input', updatePreview);
        document.getElementById('eventTime').addEventListener('input', updatePreview);
        document.getElementById('eventLocation').addEventListener('input', updatePreview);
        document.getElementById('eventImage').addEventListener('change', (e) => {
            currentImageFile = e.target.files[0];
            updatePreview();
        });

        async function loadAdminEvents() {
            const res = await fetch('/api/events');
            const events = await res.json();
            const container = document.getElementById('eventsList');
            container.innerHTML = events.map(event => `
                <div class="event-card">
                    <div class="event-info">
                        <div><strong>${event.title}</strong> (${event.date})</div>
                        <button class="btn-outline" onclick="editEvent(${event.id})">Редактировать</button>
                        <button class="btn-outline" onclick="deleteEvent(${event.id})">Удалить</button>
                    </div>
                </div>
            `).join('');
        }

        window.editEvent = async (id) => {
            editingEventId = id;
            document.getElementById('modalTitle').innerText = 'Редактировать мероприятие';
            // Загружаем данные мероприятия
            const res = await fetch(`/api/events/${id}`);
            const data = await res.json();
            const ev = data.event;
            document.getElementById('eventTitle').value = ev.title;
            document.getElementById('eventDescription').value = ev.description;
            document.getElementById('eventDate').value = ev.date;
            document.getElementById('eventTime').value = ev.time;
            document.getElementById('eventLocation').value = ev.location;
            // Если есть изображение, показываем его в предпросмотре (но не загружаем файл)
            if (ev.image_url) {
                const imgDiv = document.getElementById('previewImage');
                imgDiv.style.backgroundImage = `url(${ev.image_url})`;
                imgDiv.style.backgroundSize = 'cover';
                imgDiv.style.backgroundPosition = 'center';
                imgDiv.innerHTML = '';
                currentImageFile = null; // не меняем файл, оставляем старый
            } else {
                currentImageFile = null;
                updatePreview();
            }
            document.getElementById('eventModal').style.display = 'block';
            updatePreview(); // обновить превью
        };

        window.deleteEvent = async (id) => {
            if (!confirm('Удалить мероприятие?')) return;
            const token = getToken();
            await fetch(`/api/events/${id}`, { method: 'DELETE', headers: { 'Authorization': `Bearer ${token}` } });
            loadAdminEvents();
        };

        document.getElementById('eventForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            const token = getToken();
            let url = '/api/events';
            let method = 'POST';
            if (editingEventId) {
                url = `/api/events/${editingEventId}`;
                method = 'PUT';
            }
            const res = await fetch(url, {
                method,
                headers: { 'Authorization': `Bearer ${token}` },
                body: formData
            });
            if (res.ok) {
                closeModal();
                loadAdminEvents();
            } else {
                alert('Ошибка сохранения');
            }
        });

        // Загрузка всех отзывов для модерации
        async function loadAllReviews() {
            const res = await fetch('/api/events');
            const events = await res.json();
            let allReviews = [];
            for (let ev of events) {
                const revRes = await fetch(`/api/events/${ev.id}`);
                const data = await revRes.json();
                data.reviews.forEach(r => {
                    r.event_title = ev.title;
                    allReviews.push(r);
                });
            }
            const container = document.getElementById('reviewsList');
            if (allReviews.length === 0) {
                container.innerHTML = '<p>Нет отзывов.</p>';
                return;
            }
            container.innerHTML = allReviews.map(r => `
                <div class="event-card">
                    <div class="event-info">
                        <div><strong>${r.event_title}</strong> - ${r.user_name || 'Гость'}</div>
                        <p>${r.text}</p>
                        ${r.photo_url ? `<img src="${r.photo_url}" style="max-width:100px;">` : ''}
                        <button class="btn-outline" onclick="deleteReview(${r.id})">Удалить</button>
                    </div>
                </div>
            `).join('');
        }

        // Загрузка заявок на все мероприятия
        async function loadAllApplications() {
            const res = await fetch('/api/events');
            const events = await res.json();
            let allApps = [];
            for (let ev of events) {
                const appsRes = await fetch(`/api/events/${ev.id}/applications`, { headers: { 'Authorization': `Bearer ${getToken()}` } });
                if (appsRes.ok) {
                    const apps = await appsRes.json();
                    apps.forEach(a => {
                        a.event_title = ev.title;
                        allApps.push(a);
                    });
                }
            }
            const container = document.getElementById('applicationsList');
            if (allApps.length === 0) {
                container.innerHTML = '<p>Нет заявок.</p>';
                return;
            }
            container.innerHTML = allApps.map(a => `
                <div class="event-card">
                    <div class="event-info">
                        <div><strong>${a.event_title}</strong></div>
                        <div>Имя: ${a.guest_name || a.user_name}</div>
                        <div>Email: ${a.guest_email || a.user_email}</div>
                        <div>Статус: ${a.status === 'pending' ? 'Ожидает' : a.status === 'approved' ? 'Подтверждена' : 'Отклонена'}</div>
                        ${a.status === 'pending' ? `
                            <button class="btn-outline" onclick="changeStatus(${a.id}, 'approved')">Подтвердить</button>
                            <button class="btn-outline" onclick="changeStatus(${a.id}, 'rejected')">Отклонить</button>
                        ` : ''}
                    </div>
                </div>
            `).join('');
        }

        window.changeStatus = async (appId, status) => {
            const token = getToken();
            await fetch(`/api/applications/${appId}`, {
                method: 'PATCH',
                headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({ status })
            });
            loadAllApplications();
        };

        window.deleteReview = async (id) => {
            if (!confirm('Удалить отзыв?')) return;
            const token = getToken();
            await fetch(`/api/reviews/${id}`, { method: 'DELETE', headers: { 'Authorization': `Bearer ${token}` } });
            loadAllReviews();
        };

        document.getElementById('createEventBtn').addEventListener('click', () => {
            editingEventId = null;
            document.getElementById('modalTitle').innerText = 'Создать мероприятие';
            document.getElementById('eventForm').reset();
            currentImageFile = null;
            updatePreview();
            document.getElementById('eventModal').style.display = 'block';
        });

        // Проверка роли
        const user = getUser();
        if (!user || user.role !== 'admin') {
            window.location.href = 'index.html';
        } else {
            loadAdminEvents();
            loadAllReviews();
            loadAllApplications();
        }
        updateNav();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Профиль | Молодежный центр</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <nav>
        <div class="logo">Молодежный центр</div>
        <div class="nav-links">
            <a href="index.html">Главная</a>
            <a href="login.html" id="loginLink">Вход</a>
            <a href="register.html" id="registerLink">Регистрация</a>
            <a href="profile.html" id="profileLink" style="display: none;">Профиль</a>
            <a href="admin.html" id="adminLink" style="display: none;">Админ панель</a>
            <button id="logoutBtn" style="display: none;">Выход</button>
        </div>
    </nav>

    <div class="container">
        <h1>Мой профиль</h1>
        
        <!-- Информация о пользователе -->
        <div id="profileInfo" class="event-card" style="padding:1rem; margin-bottom:1.5rem;"></div>

        <!-- Форма смены имени -->
        <h2>Редактировать профиль</h2>
        <form id="editProfileForm" class="event-card" style="padding:1rem;">
            <div class="form-group">
                <label>Новое имя</label>
                <input type="text" id="newName" required>
            </div>
            <button type="submit" class="btn">Обновить имя</button>
        </form>

        <!-- Мои заявки -->
        <h2>Мои заявки</h2>
        <div id="applicationsList" class="events-grid" style="grid-template-columns: 1fr;"></div>

        <!-- Мои отзывы -->
        <h2>Мои отзывы</h2>
        <div id="reviewsList" class="events-grid" style="grid-template-columns: 1fr;"></div>
    </div>

    <script src="js/script.js"></script>
    <script>
        // Проверка авторизации
        const user = getCurrentUser();
        if (!user) {
            // Не авторизован – перенаправляем на страницу входа
            window.location.href = 'login.html';
        }

        // Отображение информации о пользователе
        document.getElementById('profileInfo').innerHTML = `
            <p><strong>Имя:</strong> ${escapeHtml(user.name)}</p>
            <p><strong>Email:</strong> ${escapeHtml(user.email)}</p>
            <p><strong>Роль:</strong> ${user.role === 'admin' ? 'Администратор' : 'Участник'}</p>
        `;
        document.getElementById('newName').value = user.name;

        // Обработчик смены имени
        document.getElementById('editProfileForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const newName = document.getElementById('newName').value.trim();
            if (!newName) return;
            const success = await updateUser(user.id, { name: newName });
            if (success) {
                // Обновляем текущего пользователя в сессии
                const updatedUser = await getUserById(user.id);
                await setCurrentUser(updatedUser);
                showNotification('Имя обновлено!', 'success');
                // Обновляем отображение
                document.getElementById('profileInfo').innerHTML = `
                    <p><strong>Имя:</strong> ${escapeHtml(updatedUser.name)}</p>
                    <p><strong>Email:</strong> ${escapeHtml(updatedUser.email)}</p>
                    <p><strong>Роль:</strong> ${updatedUser.role === 'admin' ? 'Администратор' : 'Участник'}</p>
                `;
                // Обновляем навигацию (в ней может отображаться имя в ссылке "Профиль")
                await updateNav();
            } else {
                alert('Ошибка обновления имени');
            }
        });

        // Загрузка и отображение заявок пользователя
        async function loadUserApplications() {
            const appsContainer = document.getElementById('applicationsList');
            const events = await getEvents();
            const applications = await getUserApplications(user.id, user.email);
            if (applications.length === 0) {
                appsContainer.innerHTML = '<div class="event-card" style="padding:1rem; text-align:center;">Вы ещё не подавали заявок.</div>';
                return;
            }
            appsContainer.innerHTML = applications.map(app => {
                const event = events.find(e => e.id === app.eventId);
                const eventTitle = event ? event.title : 'Мероприятие удалено';
                const statusText = app.status === 'pending' ? 'Ожидает' : (app.status === 'approved' ? 'Подтверждена' : 'Отклонена');
                return `
                    <div class="event-card" style="margin-bottom:1rem;">
                        <div class="event-info">
                            <div class="event-title">${escapeHtml(eventTitle)}</div>
                            <div>Статус: ${statusText}</div>
                            <div>Дата заявки: ${app.createdAt}</div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Загрузка и отображение отзывов пользователя
        async function loadUserReviews() {
            const revContainer = document.getElementById('reviewsList');
            const events = await getEvents();
            const allReviews = await getReviews();
            const myReviews = allReviews.filter(r => r.userId === user.id);
            if (myReviews.length === 0) {
                revContainer.innerHTML = '<div class="event-card" style="padding:1rem; text-align:center;">Вы ещё не оставляли отзывов.</div>';
                return;
            }
            revContainer.innerHTML = myReviews.map(rev => {
                const event = events.find(e => e.id === rev.eventId);
                const eventTitle = event ? event.title : 'Мероприятие удалено';
                return `
                    <div class="review-item">
                        <div class="event-title">${escapeHtml(eventTitle)}</div>
                        <div class="review-rating">${'★'.repeat(rev.rating)}${'☆'.repeat(5-rev.rating)}</div>
                        <div>${escapeHtml(rev.text)}</div>
                        ${rev.photo ? `<img class="review-photo" src="${rev.photo}" alt="Фото">` : ''}
                        <div style="font-size:0.8rem; margin-top:0.5rem;">${rev.date}</div>
                        <div style="margin-top:0.5rem;">
                            <button class="btn-outline" onclick="deleteMyReview(${rev.id})">Удалить отзыв</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Функция удаления своего отзыва (вызывается из кнопки)
        window.deleteMyReview = async (reviewId) => {
            if (!confirm('Удалить этот отзыв?')) return;
            const success = await deleteReview(reviewId, user.id, user.role);
            if (success) {
                showNotification('Отзыв удалён', 'success');
                await loadUserReviews();  // перезагружаем список отзывов
            } else {
                alert('Не удалось удалить отзыв');
            }
        };

        // Инициализация страницы
        (async () => {
            // Ждём, пока данные в script.js загрузятся (глобально appData уже инициализирован)
            // Но на всякий случай принудительно обновим кэш
            await refreshData();
            await loadUserApplications();
            await loadUserReviews();
        })();
    </script>
</body>
</html>

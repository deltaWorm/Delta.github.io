<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Профиль | Молодежный центр</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <div class="logo">Молодежный центр</div>
        <div class="nav-links">
            <a href="index.html">Главная</a>
            <a href="profile.html" class="active">Профиль</a>
            <a href="admin.html" id="adminLink" style="display: none;">Админ панель</a>
            <button id="logoutBtn">Выход</button>
        </div>
    </nav>

    <div class="container">
        <h1>Мой профиль</h1>
        <div id="profileInfo"></div>
        <h2>Мои заявки</h2>
        <div id="applicationsList"></div>
        <h2>Мои отзывы</h2>
        <div id="reviewsList"></div>
    </div>

    <script src="script.js"></script>
    <script>
        async function loadProfile() {
            const token = getToken();
            if (!token) {
                window.location.href = 'login.html';
                return;
            }
            const user = getUser();
            document.getElementById('profileInfo').innerHTML = `
                <div class="event-card">
                    <div class="event-info">
                        <p><strong>Имя:</strong> ${user.name}</p>
                        <p><strong>Email:</strong> ${user.email}</p>
                        <p><strong>Роль:</strong> ${user.role === 'admin' ? 'Администратор' : 'Участник'}</p>
                    </div>
                </div>
            `;
            // Заявки
            const appsRes = await fetch('/api/user/applications', { headers: { 'Authorization': `Bearer ${token}` } });
            const apps = await appsRes.json();
            const appsDiv = document.getElementById('applicationsList');
            if (apps.length === 0) appsDiv.innerHTML = '<p>Вы ещё не подавали заявок.</p>';
            else {
                appsDiv.innerHTML = apps.map(app => `
                    <div class="event-card">
                        <div class="event-info">
                            <div><strong>${app.event_title || 'Мероприятие'}</strong></div>
                            <div>Статус: ${app.status === 'pending' ? 'Ожидает' : app.status === 'approved' ? 'Подтверждена' : 'Отклонена'}</div>
                            <div>Дата заявки: ${new Date(app.created_at).toLocaleDateString()}</div>
                        </div>
                    </div>
                `).join('');
            }
            // Отзывы
            const revRes = await fetch('/api/user/reviews', { headers: { 'Authorization': `Bearer ${token}` } });
            const reviews = await revRes.json();
            const revDiv = document.getElementById('reviewsList');
            if (reviews.length === 0) revDiv.innerHTML = '<p>Вы ещё не оставляли отзывов.</p>';
            else {
                revDiv.innerHTML = reviews.map(rev => `
                    <div class="event-card">
                        <div class="event-info">
                            <div><strong>${rev.event_title}</strong></div>
                            <div>${rev.text}</div>
                            ${rev.photo_url ? `<img src="${rev.photo_url}" style="max-width:100%; max-height:150px;">` : ''}
                            <div>${new Date(rev.created_at).toLocaleDateString()}</div>
                            <button class="btn btn-outline" onclick="deleteReview(${rev.id})">Удалить</button>
                        </div>
                    </div>
                `).join('');
            }
        }
        window.deleteReview = async (id) => {
            if (!confirm('Удалить отзыв?')) return;
            const token = getToken();
            await fetch(`/api/reviews/${id}`, { method: 'DELETE', headers: { 'Authorization': `Bearer ${token}` } });
            loadProfile();
        };
        loadProfile();
        updateNav();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация | Молодежный центр</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Навигация -->
    <nav>
        <div class="logo">Молодежный центр</div>
        <div class="nav-links">
            <a href="index.html">Главная</a>
            <a href="login.html">Вход</a>
            <a href="register.html" class="active">Регистрация</a>
            <a href="profile.html" id="profileLink" style="display: none;">Профиль</a>
            <a href="admin.html" id="adminLink" style="display: none;">Админ панель</a>
            <button id="logoutBtn" style="display: none;">Выход</button>
        </div>
    </nav>

    <div class="container" style="max-width: 500px; margin-top: 2rem;">
        <h2>Регистрация нового пользователя</h2>
        <form id="registerForm">
            <div class="form-group">
                <label for="name">Имя</label>
                <input type="text" id="name" name="name" required placeholder="Иван Иванов">
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required placeholder="ivan@example.ru">
            </div>
            <div class="form-group">
                <label for="password">Пароль</label>
                <input type="password" id="password" name="password" required placeholder="минимум 6 символов">
            </div>
            <button type="submit" class="btn">Зарегистрироваться</button>
        </form>
        <p style="margin-top: 1rem; text-align: center;">
            Уже есть аккаунт? <a href="login.html">Войти</a>
        </p>
    </div>

    <script src="js/script.js"></script>
    <script>
        // Обработчик формы регистрации
        document.getElementById('registerForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            if (!name || !email || !password) {
                showNotification('Заполните все поля', 'error');
                return;
            }
            if (password.length < 6) {
                showNotification('Пароль должен быть не менее 6 символов', 'error');
                return;
            }

            const users = getUsers(); // из script.js
            if (users.find(u => u.email === email)) {
                showNotification('Пользователь с таким email уже существует', 'error');
                return;
            }

            const newUser = addUser({ name, email, password, role: 'user' });
            setCurrentUser({ id: newUser.id, name: newUser.name, email: newUser.email, role: 'user' });
            showNotification('Регистрация успешна! Добро пожаловать.', 'success');
            window.location.href = 'index.html';
        });

        updateNav();
    </script>
</body>
</html>
